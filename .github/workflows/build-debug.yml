name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ci/lorebook-entry-editor]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [feature]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ matrix.kind == 'upstream' && '5ddb264b72f00c9c747d3b72bf58560ea3338a27' || 'ci/lorebook-entry-editor' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-android-native
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prepare unsigned debug-only verification
        run: |
          python - <<'PY'
          from pathlib import Path
          build = Path('app/build.gradle.kts')
          text = build.read_text()
          old = 'check(kdfFactor == HD_GUARD_EXPECTED_FACTOR)'
          assert text.count(old) == 1
          build.write_text(text.replace(old, 'check(signSecret.isEmpty() || kdfFactor == HD_GUARD_EXPECTED_FACTOR)'))
          crypto = Path('app/src/main/java/me/rerere/rikkahub/plugin/crypto/PluginCrypto.kt')
          text = crypto.read_text()
          old = 'private fun deriveKey(context: Context): SecretKey {'
          assert text.count(old) == 1
          crypto.write_text(text.replace(old, old + '\n        check(!BuildConfig.DEBUG) { "Encrypted plugins unavailable in unsigned CI debug builds" }'))
          PY
          chmod +x gradlew
      - name: Test lorebook entry editor
        if: matrix.kind == 'feature'
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'me.rerere.rikkahub.ui.pages.extensions.LorebookEntry*Test' \
            -x :web:buildWebUi --stacktrace 2>&1 | tee editor-test.log
          cp -r app/build/test-results/testDebugUnitTest editor-test-results
      - name: Compare existing prompt injection tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'me.rerere.rikkahub.data.ai.transformers.PromptInjectionTransformerTest' \
            -x :web:buildWebUi --stacktrace 2>&1 | tee test.log
      - name: Build debug APK
        if: matrix.kind == 'feature'
        run: ./gradlew assembleDebug -x :web:buildWebUi --stacktrace
      - name: Enable KVM for Compose gesture verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test safety layout and real pointer gestures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.rikkahub.ui.pages.extensions.LorebookEntryLayoutTest,me.rerere.rikkahub.ui.pages.extensions.LorebookEntryBatchUiTest -x :web:buildWebUi --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lorebook-entry-editor-test-results-${{ matrix.kind }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            test.log
            editor-test.log
            editor-test-results/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'feature' && success()
        with:
          name: lorebook-entry-editor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
