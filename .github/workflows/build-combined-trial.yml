name: Build combined trial APK (minimal)
on:
  push:
    branches: [ci/lorebook-custom-thought-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-android-native
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prepare unsigned debug-only verification
        run: |
          python - <<'PY'
          from pathlib import Path
          build = Path('app/build.gradle.kts')
          text = build.read_text()
          old = 'check(kdfFactor == HD_GUARD_EXPECTED_FACTOR)'
          assert text.count(old) == 1
          build.write_text(text.replace(old, 'check(signSecret.isEmpty() || kdfFactor == HD_GUARD_EXPECTED_FACTOR)'))
          crypto = Path('app/src/main/java/me/rerere/rikkahub/plugin/crypto/PluginCrypto.kt')
          text = crypto.read_text()
          old = 'private fun deriveKey(context: Context): SecretKey {'
          assert text.count(old) == 1
          crypto.write_text(text.replace(old, old + '\n        check(!BuildConfig.DEBUG) { "Encrypted plugins unavailable in unsigned CI debug builds" }'))
          PY
          chmod +x gradlew
      - name: Build trial APK
        run: |
          ./gradlew :app:assembleDebug -x :web:buildWebUi --stacktrace
          mkdir -p trial-apk
          cp app/build/outputs/apk/debug/app-debug.apk trial-apk/huadeng-3.3.0-worldbook-custom-thought-debug.apk
          sha256sum trial-apk/*.apk > trial-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: huadeng-worldbook-custom-thought-debug
          path: trial-apk/
          if-no-files-found: error
